<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME PHYSIQUE v11.1 - CLONING SYS & MOBILE FIX</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #121216;
            --bg-input: #0a0a0c;
            --border-color: #333333; 
            --border-light: #555555;
            --neon-red: #ff1744;
            --burgundy: #800020;
            --text-main: #c4c4c4;
            --text-muted: #888888;
            --rpe-bg: #1a0505;
            --rpe-text: #ff1744;
            --green: #00e676; 
            --yellow: #ffea00;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background-image: 
                linear-gradient(rgba(255, 23, 68, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 23, 68, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(180deg, rgba(18, 18, 22, 0.95) 0%, rgba(5, 5, 5, 0.98) 100%);
            border-left: 1px solid var(--burgundy);
            border-right: 1px solid var(--burgundy);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(128, 0, 32, 0.2);
            padding-bottom: 50px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(90deg, #000, var(--bg-card), #000);
            border-bottom: 2px solid var(--neon-red);
            box-shadow: 0 2px 15px rgba(255, 23, 68, 0.2);
        }
        .header h1 {
            margin: 0; font-size: 1.5rem; text-transform: uppercase;
            letter-spacing: 3px; font-family: 'Share Tech Mono', monospace; color: #fff;
        }
        .header h1 span { color: var(--neon-red); text-shadow: 0 0 8px rgba(255, 23, 68, 0.6); }
        .tag-alumno {
            background-color: rgba(255, 23, 68, 0.1); color: var(--neon-red); padding: 4px 12px;
            font-size: 0.8rem; font-family: 'Share Tech Mono', monospace; border: 1px solid var(--neon-red);
            text-transform: uppercase; box-shadow: 0 0 10px rgba(255, 23, 68, 0.2);
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        .view { display: none; padding: 25px; }
        .view.active { display: block; }

        .btn {
            background-color: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-light);
            padding: 10px 15px; cursor: pointer; font-weight: 700; font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase; transition: 0.3s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .btn:hover { 
            border-color: var(--neon-red); color: var(--neon-red);
            background-color: rgba(255, 23, 68, 0.05); box-shadow: 0 0 15px rgba(255, 23, 68, 0.2);
        }
        .btn-primary {
            background: linear-gradient(45deg, var(--burgundy), var(--bg-card));
            border: 1px solid var(--neon-red); color: #fff; width: 100%; padding: 15px;
            font-size: 1.1rem; letter-spacing: 2px; margin-bottom: 20px; box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }
        .btn-primary:hover { 
            background: linear-gradient(45deg, var(--neon-red), var(--burgundy));
            border-color: var(--neon-red); box-shadow: 0 0 20px rgba(255, 23, 68, 0.4);
        }

        .client-card {
            background: linear-gradient(135deg, var(--bg-input) 0%, var(--bg-card) 100%);
            border: 1px solid var(--border-light); padding: 18px; margin-bottom: 15px;
            display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: 0.3s;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }
        .client-card:hover { 
            border-color: var(--neon-red); box-shadow: -5px 0 0 var(--neon-red);
            background: linear-gradient(135deg, var(--burgundy) 0%, var(--bg-card) 100%);
        }
        .client-card span:first-child { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; color: #fff; }

        /* PERFIL CLÍNICO GLOBAL */
        .client-profile-bar {
            background: rgba(0, 0, 0, 0.6); border: 1px solid var(--border-light);
            border-top: 2px solid var(--neon-red); padding: 15px; margin-bottom: 25px;
            border-radius: 4px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
        }
        .profile-item { display: flex; flex-direction: column; gap: 5px; }
        .profile-label { font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; color: var(--text-muted); }
        .profile-select {
            background: var(--bg-input); color: #fff; border: 1px solid var(--border-color);
            padding: 8px; font-family: 'Rajdhani', sans-serif; font-size: 1rem; outline: none; min-width: 150px;
        }
        .profile-select:focus { border-color: var(--neon-red); }
        .progression-badge {
            background: rgba(0, 230, 118, 0.15); border: 1px solid var(--green);
            color: var(--green); padding: 8px 15px; font-family: 'Share Tech Mono', monospace;
            font-weight: bold; margin-left: auto; display: none; align-items: center; gap: 10px;
            animation: pulse-green 2s infinite; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }
        @keyframes pulse-green {
            0% { box-shadow: 0 0 5px rgba(0, 230, 118, 0.2); }
            50% { box-shadow: 0 0 20px rgba(0, 230, 118, 0.5); }
            100% { box-shadow: 0 0 5px rgba(0, 230, 118, 0.2); }
        }

        .tabs-container {
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; flex: 1;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-pill {
            background-color: var(--bg-input); border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 8px 20px; font-size: 0.9rem; font-weight: 700;
            font-family: 'Share Tech Mono', monospace; cursor: pointer; white-space: nowrap;
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); transition: 0.2s;
        }
        .tab-pill.active {
            background-color: var(--burgundy); color: white; border-color: var(--neon-red);
            box-shadow: 0 0 10px var(--burgundy);
        }
        .tab-pill:hover:not(.active) { border-color: var(--neon-red); color: var(--neon-red); }

        .block-card {
            background-color: rgba(18, 18, 22, 0.8); border: 1px solid var(--border-color);
            border-top: 3px solid var(--burgundy); margin-bottom: 30px; padding: 20px; position: relative;
        }
        .block-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px;
        }
        .block-title { font-family: 'Share Tech Mono', monospace; color: var(--neon-red); font-size: 1.2rem; text-transform: uppercase; }

        .wizard-card { background: rgba(0, 0, 0, 0.6); border: 1px dashed var(--border-light); padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .wizard-title { color: var(--text-muted); font-family: 'Share Tech Mono', monospace; font-size: 0.9rem; margin-bottom: 15px; }
        .wizard-option {
            display: block; margin-bottom: 10px; font-size: 0.95rem; color: var(--text-main);
            cursor: pointer; padding: 8px; background: var(--bg-input); border: 1px solid var(--border-color); transition: 0.2s;
        }
        .wizard-option:hover { border-color: var(--neon-red); }
        .wizard-option input { accent-color: var(--neon-red); margin-right: 10px; }

        .ex-card {
            background: linear-gradient(180deg, var(--bg-card) 0%, #0d0d10 100%); border: 1px solid var(--border-light);
            margin-bottom: 20px; position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .ex-card::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background-color: var(--border-light); }
        .ex-card:hover::before { background-color: var(--neon-red); }
        
        .ex-header {
            padding: 12px 15px; display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(90deg, var(--border-color), var(--bg-input)); border-bottom: 1px solid var(--border-light);
        }
        .ex-title-wrap { display: flex; align-items: center; gap: 10px; flex: 1; }
        .ex-triangle { color: var(--neon-red); font-size: 1rem; }
        .ex-name-input {
            background: transparent; border: none; color: white; font-size: 1.1rem;
            font-family: 'Rajdhani', sans-serif; font-weight: 700; width: 100%; outline: none; letter-spacing: 1px;
        }
        .ex-name-input::placeholder { color: var(--text-muted); }
        .rpe-wrap {
            display: flex; align-items: center; background-color: var(--rpe-bg); border: 1px solid var(--burgundy);
            padding: 3px 8px; font-family: 'Share Tech Mono', monospace;
        }
        .rpe-input { background: transparent; border: none; color: var(--rpe-text); width: 35px; font-weight: bold; font-size: 0.9rem; text-align: right; outline: none; }

        .sets-table { padding: 15px; }
        .sets-header, .set-row { display: grid; grid-template-columns: 40px 1fr 1fr 40px; gap: 15px; align-items: center; text-align: center; }
        .sets-header {
            font-size: 0.8rem; color: var(--text-muted); font-family: 'Share Tech Mono', monospace;
            border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; margin-bottom: 12px;
        }
        .set-row { margin-bottom: 10px; }
        .set-num { font-size: 1rem; font-family: 'Share Tech Mono', monospace; color: var(--text-muted); }
        .set-input {
            background-color: var(--bg-input); border: 1px solid var(--border-color); color: #fff;
            font-family: 'Share Tech Mono', monospace; padding: 10px; text-align: center; font-size: 1.1rem;
            width: 100%; box-sizing: border-box; outline: none; transition: 0.2s;
        }
        .set-input:focus { border-color: var(--neon-red); }
        .set-checkbox { width: 22px; height: 22px; accent-color: var(--neon-red); cursor: pointer; }

        .diagnostic-section {
            background-color: rgba(0,0,0,0.5); border: 1px solid var(--border-light);
            padding: 20px; margin-top: 25px; border-left: 3px solid var(--neon-red);
        }
        .diagnostic-section h3 {
            margin-top: 0; color: var(--neon-red); font-family: 'Share Tech Mono', monospace;
            font-size: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }
        
        label.diag-label { display: block; margin-top: 15px; margin-bottom: 8px; font-size: 0.9rem; color: #fff; font-family: 'Share Tech Mono', monospace; }
        select, input[type="range"].regular-slider {
            width: 100%; padding: 10px; background-color: var(--bg-input); color: white;
            border: 1px solid var(--border-color); font-family: 'Rajdhani', sans-serif; font-size: 1rem; box-sizing: border-box; outline: none;
        }
        input[type="range"].regular-slider { accent-color: var(--neon-red); }
        .radio-group { 
            display: flex; flex-direction: column; gap: 8px; background-color: var(--bg-input); 
            padding: 12px; border: 1px solid var(--border-color); 
        }
        .radio-group label { margin: 0; color: var(--text-main); font-family: 'Rajdhani', sans-serif; font-size: 1rem; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        
        .semaforo-result {
            margin-top: 20px; padding: 15px; border: 1px solid var(--border-color); background-color: var(--bg-input);
            display: flex; align-items: center; gap: 15px;
        }
        .light { width: 20px; height: 20px; border-radius: 50%; background-color: #333; }
        .status-text { font-weight: bold; font-size: 1.1rem; font-family: 'Share Tech Mono', monospace; }
        .status-msg { font-size: 0.9rem; color: var(--text-muted); margin-top: 5px; }

        .flex-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .auto-save-indicator { 
            font-size: 0.85rem; color: var(--green); font-family: 'Share Tech Mono', monospace;
            opacity: 0; transition: opacity 0.5s; text-shadow: 0 0 5px var(--green);
        }
        .auto-save-indicator.show { opacity: 1; }
        
        .day-title-input {
            width: 100%; background: transparent; border: none; color: #fff; font-size: 1.5rem;
            font-family: 'Share Tech Mono', monospace; padding-bottom: 10px; margin-bottom: 25px;
            border-bottom: 2px solid var(--burgundy); outline: none;
        }
        .day-title-input:focus { border-color: var(--neon-red); }
        .block-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }

        input[type=range].tendon-slider {
            -webkit-appearance: none; width: 100%; height: 6px; background: var(--border-color); border-radius: 3px; outline: none; padding: 0; margin: 10px 0;
        }
        input[type=range].tendon-slider::-webkit-slider-thumb {
            -webkit-appearance: none; height: 24px; width: 24px; border-radius: 50%;
            background: var(--thumb-color, var(--green)); cursor: pointer; margin-top: -9px;
            box-shadow: 0 0 12px var(--thumb-color, rgba(0, 255, 102, 0.5)); border: 2px solid var(--bg-main); transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        input[type=range].tendon-slider::-webkit-slider-runnable-track { width: 100%; height: 6px; cursor: pointer; background: transparent; border-radius: 3px; }

        /* REGLAS RESPONSIVAS PARA CELULARES (MOBILE FIX) */
        @media (max-width: 600px) {
            .ex-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .ex-title-wrap {
                width: 100%;
            }
            .rpe-wrap {
                align-self: flex-end;
            }
            .block-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
            .block-header > div {
                display: flex;
                width: 100%;
                justify-content: space-between;
            }
            .block-actions {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>PRIME <span>PHYSIQUE</span></h1>
        <div class="tag-alumno">CLINICAL SYS</div>
    </div>

    <!-- VISTA DASHBOARD -->
    <div id="view-dashboard" class="view active">
        <button class="btn btn-primary" onclick="promptNewClient()">[+] INICIALIZAR ATLETA</button>
        <div id="clients-list"></div>
    </div>

    <!-- VISTA TRACKER DEL ALUMNO -->
    <div id="view-tracker" class="view">
        <div class="flex-between">
            <button class="btn" onclick="showView('view-dashboard')">&lt; PANEL</button>
            <h2 id="tracker-client-name" style="margin:0; font-size:1.2rem; font-family:'Share Tech Mono', monospace; color:#fff;">ATLETA</h2>
            <span id="save-indicator" class="auto-save-indicator">GUARDADO</span>
        </div>

        <!-- Perfil Clínico / Progresión -->
        <div class="client-profile-bar">
            <div class="profile-item">
                <span class="profile-label">PROTOCOLO ACTIVO:</span>
                <select id="profile-protocol" class="profile-select" onchange="updateProfile()">
                    <option value="none">-- Seleccionar --</option>
                    <option value="lumbar">Rehab Lumbar</option>
                    <option value="tendinoso">Rehab Tendinosa</option>
                </select>
            </div>
            <div class="profile-item">
                <span class="profile-label">FASE ACTUAL:</span>
                <select id="profile-phase" class="profile-select" onchange="updateProfile()">
                    <option value="none">-- Seleccionar Protocolo --</option>
                </select>
            </div>
            <div id="progression-badge" class="progression-badge">
                <span style="font-size:1.2rem;">⚡</span> [!] PROGRESIÓN AUTORIZADA
            </div>
        </div>

        <div style="display:flex; align-items:flex-start; margin-bottom:15px;">
            <div class="tabs-container" id="week-tabs"></div>
            <button class="btn" style="margin-left:15px; border-color:var(--burgundy); color:var(--text-muted); font-size:0.8rem; white-space:nowrap; height: 35px;" onclick="propagateForward()" title="Copiar diseño actual a las semanas posteriores">[»] PROPAGAR</button>
        </div>
        <div class="tabs-container" id="day-tabs"></div>

        <div id="day-content">
            <input type="text" id="day-name-input" class="day-title-input" placeholder="DESIGNACIÓN DEL DÍA (Ej. SESIÓN 1)" oninput="autoSaveDayName()">
            
            <div class="block-actions">
                <button class="btn" style="border-color:var(--burgundy); color:var(--text-main);" onclick="addBlock('lumbar')">+ BLOQUE LUMBAR</button>
                <button class="btn" style="border-color:var(--burgundy); color:var(--text-main);" onclick="addBlock('tendinoso')">+ BLOQUE TENDINOSO</button>
            </div>

            <div id="blocks-container"></div>
            
            <button class="btn" style="width:100%; margin-top:25px; border-color:var(--border-light); color:#fff;" onclick="deleteCurrentDay()">PURGAR DÍA ACTUAL</button>
        </div>
    </div>
</div>

<script>
    let db = { clients: [] };
    let cClientIndex = null;
    let cWeek = 1;
    let cDayIndex = 0;
    let saveTimeout = null;
    let titleSaveTimeout = null;

    const textosDolor = [
        "Sin dolor alguno", "Molestia muy leve, apenas se siente", "Molestia leve, fácil de ignorar",
        "Dolor suave, presente pero no interfiere", "Dolor moderado, se nota constantemente",
        "Dolor límite, molesto pero tolerable", "Dolor fuerte, empieza a dificultar el movimiento",
        "Dolor muy fuerte, interfiere claramente", "Dolor intenso, muy difícil continuar",
        "Dolor severo, impide la actividad", "El peor dolor imaginable, insoportable"
    ];

    const dataEstados = {
        VERDE_CORTO: { title: "VERDE - VAS CORTO DE CARGA", color: "var(--green)", desc: "El estímulo se le queda corto: así el tejido no tiene motivo para adaptarse.", action: "→ SUBE CARGA CON DECISIÓN" },
        VERDE_OPTIMO: { title: "VERDE ÓPTIMO", color: "var(--green)", desc: "Molestia tolerable intra-sesión y buena asimilación a las 24 h.", action: "→ PROGRESA UN ESCALÓN" },
        VERDE_ALTO: { title: "VERDE ALTO", color: "var(--green)", desc: "Parte alta de la ventana terapéutica. Queda poco margen antes de sobrecarga.", action: "→ CONSOLIDA UNA SEMANA" },
        AMARILLO_RIGIDEZ: { title: "AMARILLO - RIGIDEZ MATUTINA", color: "var(--yellow)", desc: "Aviso temprano de sobrecarga estructural sin aumento de dolor percibido.", action: "→ NO PROGRESAR CARGA" },
        AMARILLO_MOLESTA: { title: "AMARILLO - MOLESTIA INTRA-SESIÓN", color: "var(--yellow)", desc: "Dosis bien asimilada a las 24h, pero ejecución excesivamente dolorosa.", action: "→ AJUSTAR TÉCNICA/RANGO, NO PESO" },
        AMARILLO_FACTURA: { title: "AMARILLO - LÍMITE TISULAR", color: "var(--yellow)", desc: "El tejido se queja a las 24h. Techo de asimilación actual alcanzado.", action: "→ MANTENER CARGA / BAJAR SI EMPEORA" },
        AMARILLO_ALTO: { title: "AMARILLO ALTO", color: "var(--yellow)", desc: "Doble señal de alerta (durante y post). Rozando el límite lesivo.", action: "→ NO PROGRESAR, REDUCIR VOLUMEN" },
        ROJO: { title: "ROJO", color: "var(--neon-red)", desc: "Respuesta clara por encima del basal a las 24h. Ventana de carga excedida.", action: "→ BAJAR UN ESCALÓN Y REEVALUAR" },
        ROJO_ALTO: { title: "ROJO ALTO - TEJIDO IRRITADO", color: "var(--neon-red)", desc: "Estado de irritación. No se puede dosificar hacia abajo de forma normal.", action: "→ DESCARGA A ISOMÉTRICOS / RETIRAR" },
        ROJO_MAXIMO: { title: "ROJO MÁXIMO - REPLANTEA", color: "var(--neon-red)", desc: "Dolor extremo y sostenido. Protocolo actual totalmente inadecuado.", action: "→ ABORTAR EJERCICIO INMEDIATAMENTE" }
    };

    function obtenerColorInterpolado(val) {
        let r, g, b;
        if (val <= 5) {
            const factor = val / 5;
            r = Math.round(0 + factor * (255 - 0));
            g = Math.round(255 + factor * (204 - 255));
            b = Math.round(102 + factor * (0 - 102));
        } else {
            const factor = (val - 5) / 5;
            r = 255; g = Math.round(204 + factor * (0 - 204)); b = Math.round(0 + factor * (60 - 0));
        }
        return `rgb(${r}, ${g}, ${b})`;
    }

    window.onload = () => {
        const stored = localStorage.getItem('prime_v11_db');
        if (stored) {
            db = JSON.parse(stored);
            db.clients.forEach(c => { if(!c.profile) c.profile = { protocol: 'none', phase: 'none' }; });
        }
        renderDashboard();
    };

    function triggerSaveIndicator() {
        const ind = document.getElementById('save-indicator');
        ind.classList.add('show'); setTimeout(() => ind.classList.remove('show'), 1500);
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function renderDashboard() {
        const list = document.getElementById('clients-list'); list.innerHTML = '';
        if(db.clients.length === 0) {
            list.innerHTML = '<p style="color:var(--text-muted); text-align:center; font-family:\'Share Tech Mono\';">SISTEMA VACÍO.</p>'; return;
        }
        db.clients.forEach((c, idx) => {
            list.innerHTML += `<div class="client-card" onclick="openTracker(${idx})"><span>${c.name}</span><span style="color:var(--neon-red); font-family:'Share Tech Mono'; font-size:0.9rem;">[ ABRIR ]</span></div>`;
        });
        showView('view-dashboard');
    }

    function promptNewClient() {
        const name = prompt("Nombre del Atleta:");
        if (name) {
            let weeks = {}; for(let i=1; i<=12; i++) weeks[i] = [];
            db.clients.push({ name, weeks, profile: { protocol: 'none', phase: 'none' } });
            localStorage.setItem('prime_v11_db', JSON.stringify(db)); renderDashboard();
        }
    }

    function openTracker(clientIdx) {
        cClientIndex = clientIdx; cWeek = 1; cDayIndex = 0;
        document.getElementById('tracker-client-name').innerText = db.clients[cClientIndex].name;
        updateProfileUI(); renderTabs(); showView('view-tracker');
    }

    /* LOGICA DE PERFIL Y PROGRESIÓN */
    function updateProfileUI() {
        const p = db.clients[cClientIndex].profile;
        document.getElementById('profile-protocol').value = p.protocol;
        const phaseSelect = document.getElementById('profile-phase');
        phaseSelect.innerHTML = '<option value="none">-- Seleccionar --</option>';
        if(p.protocol === 'lumbar') {
            phaseSelect.innerHTML += `<option value="Fase 1">Fase 1: Centralización</option><option value="Fase 2">Fase 2: Core/Estabilidad</option><option value="Fase 3">Fase 3: Carga Axial</option>`;
        } else if(p.protocol === 'tendinoso') {
            phaseSelect.innerHTML += `<option value="Fase 1">Fase 1: Movilidad / Analgesia</option><option value="Fase 2">Fase 2: Fuerza Específica</option><option value="Fase 3">Fase 3: Fuerza General</option><option value="Fase 4">Fase 4: Potencia / Pliometría</option>`;
        }
        phaseSelect.value = p.phase;
        document.getElementById('progression-badge').style.display = checkProgression() ? 'flex' : 'none';
    }

    function updateProfile() {
        const protocol = document.getElementById('profile-protocol').value;
        const phase = document.getElementById('profile-phase').value;
        if(db.clients[cClientIndex].profile.protocol !== protocol) {
            db.clients[cClientIndex].profile.protocol = protocol;
            db.clients[cClientIndex].profile.phase = 'none';
            updateProfileUI(); 
        } else {
            db.clients[cClientIndex].profile.phase = phase;
        }
        autoSave();
    }

    function checkProgression() {
        if(cClientIndex === null) return false;
        const client = db.clients[cClientIndex];
        const protocol = client.profile.protocol;
        if(protocol === 'none') return false;

        let qualifyingWeeks = 0; let weeksChecked = 0;

        for(let w = 12; w >= 1; w--) {
            const days = client.weeks[w] || [];
            let protocolFoundInWeek = false; let maxPost24 = -1;

            days.forEach(day => {
                day.blocks.forEach(b => {
                    if(b.type === protocol) {
                        protocolFoundInWeek = true;
                        let p24 = 0;
                        if(protocol === 'lumbar') p24 = parseInt(b.tracker.post24) || 0;
                        else p24 = parseInt(b.tracker.eva24h) || 0;
                        if(p24 > maxPost24) maxPost24 = p24;
                    }
                });
            });

            if(protocolFoundInWeek) {
                weeksChecked++;
                if(maxPost24 <= 2) qualifyingWeeks++;
                else return false; 
            }
            if(qualifyingWeeks >= 3) return true; 
        }
        return false;
    }

    /* LOGICA DE CLONACIÓN DE SEMANAS */
    function propagateForward() {
        if(cClientIndex === null) return;
        if(confirm(`¿Sobreescribir desde W${cWeek + 1} hasta W12 usando la W${cWeek} como plantilla?\n\n(Se copiarán días, ejercicios, series, reps y kg. Se reiniciarán los semáforos de dolor y los checks para dejar la plantilla limpia).`)) {
            autoSave();
            const currentWeekData = db.clients[cClientIndex].weeks[cWeek];
            
            for(let w = cWeek + 1; w <= 12; w++) {
                let clonedWeek = JSON.parse(JSON.stringify(currentWeekData));
                clonedWeek.forEach(day => {
                    day.blocks.forEach(b => {
                        b.id = Date.now() + Math.random(); 
                        if(b.type === 'lumbar') {
                            b.tracker.eva = 0; b.tracker.post24 = 0;
                        } else {
                            b.tracker.evaDurante = 0; b.tracker.eva24h = 0; b.tracker.rigidez = false;
                        }
                        b.exercises.forEach(ex => {
                            ex.sets.forEach(s => s.done = false);
                        });
                    });
                });
                db.clients[cClientIndex].weeks[w] = clonedWeek;
            }
            localStorage.setItem('prime_v11_db', JSON.stringify(db));
            triggerSaveIndicator();
            alert(`Sincronización completada. Las semanas ${cWeek + 1} a 12 son ahora clones de la W${cWeek}.`);
        }
    }

    function renderTabs() {
        const wTabs = document.getElementById('week-tabs'); wTabs.innerHTML = '';
        for(let i=1; i<=12; i++) wTabs.innerHTML += `<div class="tab-pill ${cWeek === i ? 'active' : ''}" onclick="selectWeek(${i})">W${i}</div>`;
        
        const dTabs = document.getElementById('day-tabs'); dTabs.innerHTML = '';
        const client = db.clients[cClientIndex]; const days = client.weeks[cWeek] || [];
        
        if (days.length === 0) { addDay(); } else {
            days.forEach((d, idx) => { dTabs.innerHTML += `<div class="tab-pill ${cDayIndex === idx ? 'active' : ''}" onclick="selectDay(${idx})">${d.name || 'DÍA '+(idx+1)}</div>`; });
            dTabs.innerHTML += `<div class="tab-pill" style="border-style:dashed; color:var(--text-muted); border-color:var(--border-light);" onclick="addDay()">+ DÍA</div>`;
            renderDayContent();
        }
    }

    function selectWeek(w) { cWeek = w; cDayIndex = 0; renderTabs(); }
    function selectDay(d) { cDayIndex = d; renderTabs(); }

    function addDay() {
        if(cClientIndex === null) return;
        autoSave();
        const newDay = { name: 'DÍA ' + ((db.clients[cClientIndex].weeks[cWeek].length) + 1), blocks: [] };
        db.clients[cClientIndex].weeks[cWeek].push(newDay);
        cDayIndex = db.clients[cClientIndex].weeks[cWeek].length - 1;
        localStorage.setItem('prime_v11_db', JSON.stringify(db));
        renderTabs();
    }

    function deleteCurrentDay() {
        if(confirm("¿Purgar el día actual?")) {
            autoSave();
            db.clients[cClientIndex].weeks[cWeek].splice(cDayIndex, 1);
            cDayIndex = 0;
            localStorage.setItem('prime_v11_db', JSON.stringify(db));
            renderTabs();
        }
    }

    function addBlock(type) {
        autoSave();
        const day = db.clients[cClientIndex].weeks[cWeek][cDayIndex];
        let newBlock = { id: Date.now(), type: type, exercises: [ { name: '', rpe: 7, sets: [{kg: '', reps: '', done: false}] } ], tracker: {} };

        else newBlock.tracker = { stage: 'Fase 1: Movilidad', evaDurante: 0, eva24h: 0, rigidez: false };
        day.blocks.push(newBlock);
        renderDayContent();
        localStorage.setItem('prime_v11_db', JSON.stringify(db));

    function autoSave() {
        if(cClientIndex === null || !db.clients[cClientIndex].weeks[cWeek][cDayIndex]) return;
        const day = db.clients[cClientIndex].weeks[cWeek][cDayIndex];

        document.querySelectorAll('.block-card').forEach((bCard) => {
            const bIdx = bCard.getAttribute('data-bidx'); const block = day.blocks[bIdx];
            const exCards = bCard.querySelectorAll('.ex-card');
            block.exercises = Array.from(exCards).map(exCard => {
                const setRows = exCard.querySelectorAll('.set-row');
                const sets = Array.from(setRows).map(row => ({ kg: row.querySelector('.dom-kg').value, reps: row.querySelector('.dom-reps').value, done: row.querySelector('.dom-done').checked }));
                return { name: exCard.querySelector('.dom-name').value, rpe: exCard.querySelector('.dom-rpe').value, sets: sets };
            });

            if (block.type === 'lumbar') {
                block.tracker.stage = bCard.querySelector('.l-stage').value;
                block.tracker.eva = parseInt(bCard.querySelector('.l-eva').value);
                block.tracker.nature = bCard.querySelector(`input[name="l-nature-${bIdx}"]:checked`).value;
                block.tracker.direction = bCard.querySelector(`input[name="l-dir-${bIdx}"]:checked`).value;
                block.tracker.post24 = parseInt(bCard.querySelector('.l-24').value);
                evaluateLumbar(block.tracker, bCard);
            } else {
                block.tracker.stage = bCard.querySelector('.t-stage').value;
                block.tracker.evaDurante = parseInt(bCard.querySelector('.t-durante').value);
                block.tracker.eva24h = parseInt(bCard.querySelector('.t-24h').value);
                block.tracker.rigidez = bCard.querySelector('.t-rigidez').checked;
                evaluateTendonAdvanced(block.tracker, bCard);
            }
        });

        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            localStorage.setItem('prime_v11_db', JSON.stringify(db));
            triggerSaveIndicator();
            document.getElementById('progression-badge').style.display = checkProgression() ? 'flex' : 'none';
        }, 500);
    }

    function evaluateLumbar(t, bCard) {
        let color, status, msg;
        let post24val = isNaN(parseInt(t.post24)) ? 0 : parseInt(t.post24);

        if (t.nature === 'Radicular' || t.direction === 'Periferaliza' || t.eva > 5 || post24val > 5) {
            color = 'var(--neon-red)'; status = 'ALERTA CRÍTICA'; msg = 'Compromiso radicular o empeoramiento post-sesión. Detener patrón. Reducir carga.';
        } else if ((t.eva >= 4 && t.eva <= 5) || (post24val >= 4 && post24val <= 5)) {
            color = 'var(--yellow)'; status = 'ADVERTENCIA'; msg = 'Límite tisular alcanzado. Mantener carga. Prohibida progresión.';
        } else {
            color = 'var(--green)'; status = 'ÓPTIMO'; msg = 'Adaptación confirmada y recuperación adecuada. Autorizada sobrecarga progresiva.';
        }
        
        const box = bCard.querySelector('.s-box'); box.style.borderColor = color;
        const light = bCard.querySelector('.s-light'); light.style.backgroundColor = color; light.style.boxShadow = `0 0 15px ${color}`;
        const txt = bCard.querySelector('.s-text'); txt.innerText = status; txt.style.color = color;
        bCard.querySelector('.s-msg').innerText = msg;
    }

    function evaluateTendonAdvanced(t, bCard) {
        const durante = t.evaDurante; const despues = t.eva24h; const rigidez = t.rigidez;
        const sliderD = bCard.querySelector('.t-durante'); const valD = bCard.querySelector('.val-durante'); const descD = bCard.querySelector('.desc-durante');
        const colorD = obtenerColorInterpolado(durante);
        valD.textContent = durante; valD.style.color = colorD; valD.style.textShadow = `0 0 8px ${colorD}`;
        sliderD.style.background = `linear-gradient(to right, ${colorD} ${(durante/10)*100}%, var(--border-color) ${(durante/10)*100}%)`;
        sliderD.style.setProperty('--thumb-color', colorD); descD.textContent = textosDolor[durante];

        const slider24 = bCard.querySelector('.t-24h'); const val24 = bCard.querySelector('.val-24h'); const desc24 = bCard.querySelector('.desc-24h');
        const color24 = obtenerColorInterpolado(despues);
        val24.textContent = "+" + despues; val24.style.color = color24; val24.style.textShadow = `0 0 8px ${color24}`;
        slider24.style.background = `linear-gradient(to right, ${color24} ${(despues/10)*100}%, var(--border-color) ${(despues/10)*100}%)`;
        slider24.style.setProperty('--thumb-color', color24); desc24.textContent = despues === 0 ? "Sin aumento de dolor" : textosDolor[despues];

        let estadoClave = ""; 
        if (durante <= 2) {
            if (despues <= 1) estadoClave = "VERDE_CORTO"; else if (despues === 2) estadoClave = "VERDE_OPTIMO"; else if (despues === 3) estadoClave = "VERDE_ALTO";
            else if (despues <= 5) estadoClave = "AMARILLO_FACTURA"; else if (despues <= 7) estadoClave = "ROJO"; else estadoClave = "ROJO_ALTO";
        } else if (durante <= 4) {
            if (despues <= 2) estadoClave = "VERDE_OPTIMO"; else if (despues === 3) estadoClave = "VERDE_ALTO"; else if (despues <= 5) estadoClave = "AMARILLO_FACTURA";
            else if (despues <= 7) estadoClave = "ROJO"; else estadoClave = "ROJO_ALTO";
        } else if (durante === 5) {
            if (despues <= 3) estadoClave = "VERDE_ALTO"; else if (despues <= 5) estadoClave = "AMARILLO_FACTURA"; else if (despues <= 7) estadoClave = "ROJO";
            else estadoClave = "ROJO_ALTO";
        } else if (durante <= 7) { 
            if (despues <= 3) estadoClave = "AMARILLO_MOLESTA"; else if (despues <= 5) estadoClave = "AMARILLO_ALTO"; else if (despues <= 7) estadoClave = "ROJO";
            else estadoClave = "ROJO_ALTO";
        } else {
            if (despues <= 3) estadoClave = "AMARILLO_MOLESTA"; else if (despues <= 5) estadoClave = "AMARILLO_ALTO"; else estadoClave = "ROJO_MAXIMO";
        }

        const rigidezExtra = bCard.querySelector('.rigidez-extra'); const checkGroup = bCard.querySelector('.tendon-check-group');
        if (rigidez) {
            checkGroup.classList.add('active'); checkGroup.style.borderColor = 'var(--neon-red)'; checkGroup.style.background = 'rgba(255, 23, 68, 0.1)';
            if (estadoClave.startsWith("VERDE")) { estadoClave = "AMARILLO_RIGIDEZ"; rigidezExtra.style.display = "none"; } else { rigidezExtra.style.display = "block"; }
        } else {
            checkGroup.classList.remove('active'); checkGroup.style.borderColor = 'var(--border-color)'; checkGroup.style.background = 'rgba(0,0,0,0.4)';
            rigidezExtra.style.display = "none";
        }

        const datos = dataEstados[estadoClave]; const resCard = bCard.querySelector('.tendon-result');
        resCard.style.borderLeftColor = datos.color; resCard.style.boxShadow = `0 5px 15px rgba(0,0,0,0.5), inset 4px 0 0 ${datos.color}22`;
        const dot = bCard.querySelector('.status-dot'); dot.style.backgroundColor = datos.color; dot.style.boxShadow = `0 0 12px ${datos.color}`;
        const head = bCard.querySelector('.result-heading'); head.textContent = datos.title; head.style.color = datos.color;
        bCard.querySelector('.result-desc').textContent = datos.desc; bCard.querySelector('.action-text').textContent = datos.action;
    }
</script>
</body>
</html>
