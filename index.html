<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIME PHYSIQUE v7.1 - MULTI-BLOCK PROTOCOL</title>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #050505;
            --bg-card: #121216;
            --bg-input: #0a0a0c;
            --border-color: #333333; 
            --border-light: #555555;
            --neon-red: #ff1744;
            --burgundy: #800020;
            --text-main: #c4c4c4;
            --text-muted: #888888;
            --rpe-bg: #1a0505;
            --rpe-text: #ff1744;
            --green: #00e676; 
            --yellow: #ffea00;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: 'Rajdhani', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            background-image: 
                linear-gradient(rgba(255, 23, 68, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 23, 68, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center center;
        }

        .app-container {
            max-width: 900px;
            width: 100%;
            min-height: 100vh;
            background: linear-gradient(180deg, rgba(18, 18, 22, 0.95) 0%, rgba(5, 5, 5, 0.98) 100%);
            border-left: 1px solid var(--burgundy);
            border-right: 1px solid var(--burgundy);
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(128, 0, 32, 0.2);
            padding-bottom: 50px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: linear-gradient(90deg, #000, var(--bg-card), #000);
            border-bottom: 2px solid var(--neon-red);
            box-shadow: 0 2px 15px rgba(255, 23, 68, 0.2);
        }
        .header h1 {
            margin: 0;
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-family: 'Share Tech Mono', monospace;
            color: #fff;
        }
        .header h1 span { color: var(--neon-red); text-shadow: 0 0 8px rgba(255, 23, 68, 0.6); }
        .tag-alumno {
            background-color: rgba(255, 23, 68, 0.1);
            color: var(--neon-red);
            padding: 4px 12px;
            font-size: 0.8rem;
            font-family: 'Share Tech Mono', monospace;
            border: 1px solid var(--neon-red);
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 23, 68, 0.2);
            clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
        }

        .view { display: none; padding: 25px; }
        .view.active { display: block; }

        .btn {
            background-color: var(--bg-card);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            padding: 10px 15px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            transition: 0.3s;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
        }
        .btn:hover { 
            border-color: var(--neon-red); 
            color: var(--neon-red);
            background-color: rgba(255, 23, 68, 0.05);
            box-shadow: 0 0 15px rgba(255, 23, 68, 0.2);
        }
        .btn-primary {
            background: linear-gradient(45deg, var(--burgundy), var(--bg-card));
            border: 1px solid var(--neon-red);
            color: #fff;
            width: 100%;
            padding: 15px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
        }
        .btn-primary:hover { 
            background: linear-gradient(45deg, var(--neon-red), var(--burgundy));
            border-color: var(--neon-red);
            box-shadow: 0 0 20px rgba(255, 23, 68, 0.4);
        }

        .client-card {
            background: linear-gradient(135deg, var(--bg-input) 0%, var(--bg-card) 100%);
            border: 1px solid var(--border-light);
            padding: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
            clip-path: polygon(0 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%);
        }
        .client-card:hover { 
            border-color: var(--neon-red);
            box-shadow: -5px 0 0 var(--neon-red);
            background: linear-gradient(135deg, var(--burgundy) 0%, var(--bg-card) 100%);
        }
        .client-card span:first-child { font-size: 1.3rem; font-weight: 700; letter-spacing: 1px; color: #fff; }

        .tabs-container {
            display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px;
            margin-bottom: 15px; scrollbar-width: none;
        }
        .tabs-container::-webkit-scrollbar { display: none; }
        .tab-pill {
            background-color: var(--bg-input); border: 1px solid var(--border-color);
            color: var(--text-muted); padding: 8px 20px; font-size: 0.9rem;
            font-weight: 700; font-family: 'Share Tech Mono', monospace; cursor: pointer;
            white-space: nowrap; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
            transition: 0.2s;
        }
        .tab-pill.active {
            background-color: var(--burgundy); color: white; border-color: var(--neon-red);
            box-shadow: 0 0 10px var(--burgundy);
        }
        .tab-pill:hover:not(.active) { border-color: var(--neon-red); color: var(--neon-red); }

        .block-card {
            background-color: rgba(18, 18, 22, 0.8);
            border: 1px solid var(--border-color);
            border-top: 3px solid var(--burgundy);
            margin-bottom: 30px; padding: 20px; position: relative;
        }
        .block-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border-color); padding-bottom: 15px; margin-bottom: 20px;
        }
        .block-title { font-family: 'Share Tech Mono', monospace; color: var(--neon-red); font-size: 1.2rem; text-transform: uppercase; }

        .ex-card {
            background: linear-gradient(180deg, var(--bg-card) 0%, #0d0d10 100%);
            border: 1px solid var(--border-light); margin-bottom: 20px;
            position: relative; box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        .ex-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background-color: var(--border-light);
        }
        .ex-card:hover::before { background-color: var(--neon-red); }
        
        .ex-header {
            padding: 12px 15px; display: flex; justify-content: space-between;
            align-items: center; background: linear-gradient(90deg, var(--border-color), var(--bg-input));
            border-bottom: 1px solid var(--border-light);
        }
        .ex-title-wrap { display: flex; align-items: center; gap: 10px; flex: 1; }
        .ex-triangle { color: var(--neon-red); font-size: 1rem; }
        .ex-name-input {
            background: transparent; border: none; color: white; font-size: 1.1rem;
            font-family: 'Rajdhani', sans-serif; font-weight: 700; width: 100%; outline: none; letter-spacing: 1px;
        }
        .ex-name-input::placeholder { color: var(--text-muted); }
        .rpe-wrap {
            display: flex; align-items: center; background-color: var(--rpe-bg);
            border: 1px solid var(--burgundy); padding: 3px 8px; font-family: 'Share Tech Mono', monospace;
        }
        .rpe-input {
            background: transparent; border: none; color: var(--rpe-text);
            width: 35px; font-weight: bold; font-size: 0.9rem; text-align: right; outline: none;
        }

        .sets-table { padding: 15px; }
        .sets-header, .set-row {
            display: grid; grid-template-columns: 40px 1fr 1fr 40px; gap: 15px;
            align-items: center; text-align: center;
        }
        .sets-header {
            font-size: 0.8rem; color: var(--text-muted); font-family: 'Share Tech Mono', monospace;
            border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; margin-bottom: 12px;
        }
        .set-row { margin-bottom: 10px; }
        .set-num { font-size: 1rem; font-family: 'Share Tech Mono', monospace; color: var(--text-muted); }
        .set-input {
            background-color: var(--bg-input); border: 1px solid var(--border-color);
            color: #fff; font-family: 'Share Tech Mono', monospace; padding: 10px;
            text-align: center; font-size: 1.1rem; width: 100%; box-sizing: border-box; outline: none; transition: 0.2s;
        }
        .set-input:focus { border-color: var(--neon-red); }
        .set-checkbox { width: 22px; height: 22px; accent-color: var(--neon-red); cursor: pointer; }

        .diagnostic-section {
            background-color: rgba(0,0,0,0.5); border: 1px solid var(--border-light);
            padding: 20px; margin-top: 25px; border-left: 3px solid var(--neon-red);
        }
        .diagnostic-section h3 {
            margin-top: 0; color: var(--neon-red); font-family: 'Share Tech Mono', monospace;
            font-size: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }
        
        label { display: block; margin-top: 15px; margin-bottom: 8px; font-size: 0.9rem; color: #fff; font-family: 'Share Tech Mono', monospace; }
        select, input[type="range"] {
            width: 100%; padding: 10px; background-color: var(--bg-input); color: white;
            border: 1px solid var(--border-color); font-family: 'Rajdhani', sans-serif; font-size: 1rem;
            box-sizing: border-box; outline: none;
        }
        input[type="range"] { accent-color: var(--neon-red); }
        .radio-group { 
            display: flex; flex-direction: column; gap: 8px; background-color: var(--bg-input); 
            padding: 12px; border: 1px solid var(--border-color); 
        }
        .radio-group label { margin: 0; color: var(--text-main); font-family: 'Rajdhani', sans-serif; font-size: 1rem; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        
        .semaforo-result {
            margin-top: 20px; padding: 15px; border: 1px solid var(--border-color);
            background-color: var(--bg-input); display: flex; align-items: center; gap: 15px;
        }
        .light { width: 20px; height: 20px; border-radius: 50%; background-color: #333; }
        .status-text { font-weight: bold; font-size: 1.1rem; font-family: 'Share Tech Mono', monospace; }
        .status-msg { font-size: 0.9rem; color: var(--text-muted); margin-top: 5px; }

        .flex-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .auto-save-indicator { 
            font-size: 0.85rem; color: var(--green); font-family: 'Share Tech Mono', monospace;
            opacity: 0; transition: opacity 0.5s; text-shadow: 0 0 5px var(--green);
        }
        .auto-save-indicator.show { opacity: 1; }
        
        .day-title-input {
            width: 100%; background: transparent; border: none; color: #fff;
            font-size: 1.5rem; font-family: 'Share Tech Mono', monospace;
            padding-bottom: 10px; margin-bottom: 25px; border-bottom: 2px solid var(--burgundy); outline: none;
        }
        .day-title-input:focus { border-color: var(--neon-red); }
        
        .block-actions {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>PRIME <span>PHYSIQUE</span></h1>
        <div class="tag-alumno">CLINICAL SYS</div>
    </div>

    <!-- VISTA 1: DASHBOARD -->
    <div id="view-dashboard" class="view active">
        <button class="btn btn-primary" onclick="promptNewClient()">[+] INICIALIZAR ATLETA</button>
        <div id="clients-list"></div>
    </div>

    <!-- VISTA 2: TRACKER DEL ALUMNO (SEMANAS Y DÍAS) -->
    <div id="view-tracker" class="view">
        <div class="flex-between">
            <button class="btn" onclick="showView('view-dashboard')">&lt; PANEL</button>
            <h2 id="tracker-client-name" style="margin:0; font-size:1.2rem; font-family:'Share Tech Mono', monospace; color:#fff;">ATLETA</h2>
            <span id="save-indicator" class="auto-save-indicator">GUARDADO</span>
        </div>

        <div class="tabs-container" id="week-tabs"></div>
        <div class="tabs-container" id="day-tabs"></div>

        <div id="day-content">
            <input type="text" id="day-name-input" class="day-title-input" placeholder="DESIGNACIÓN DEL DÍA (Ej. SESIÓN 1)" oninput="autoSaveDayName()">
            
            <div class="block-actions">
                <button class="btn" style="border-color:var(--burgundy); color:var(--text-main);" onclick="addBlock('lumbar')">+ BLOQUE LUMBAR</button>
                <button class="btn" style="border-color:var(--burgundy); color:var(--text-main);" onclick="addBlock('tendinoso')">+ BLOQUE TENDINOSO</button>
            </div>

            <div id="blocks-container"></div>
            
            <button class="btn" style="width:100%; margin-top:25px; border-color:var(--border-light); color:#fff;" onclick="deleteCurrentDay()">PURGAR DÍA ACTUAL</button>
        </div>
    </div>
</div>

<script>
    let db = { clients: [] };
    let cClientIndex = null;
    let cWeek = 1;
    let cDayIndex = 0;
    let saveTimeout = null;
    let titleSaveTimeout = null;

    window.onload = () => {
        const stored = localStorage.getItem('prime_v7_db');
        if (stored) db = JSON.parse(stored);
        renderDashboard();
    };

    function triggerSaveIndicator() {
        const ind = document.getElementById('save-indicator');
        ind.classList.add('show');
        setTimeout(() => ind.classList.remove('show'), 1500);
    }

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function renderDashboard() {
        const list = document.getElementById('clients-list');
        list.innerHTML = '';
        if(db.clients.length === 0) {
            list.innerHTML = '<p style="color:var(--text-muted); text-align:center; font-family:\'Share Tech Mono\';">SISTEMA VACÍO.</p>';
            return;
        }
        db.clients.forEach((c, idx) => {
            list.innerHTML += `
                <div class="client-card" onclick="openTracker(${idx})">
                    <span>${c.name}</span>
                    <span style="color:var(--neon-red); font-family:'Share Tech Mono'; font-size:0.9rem;">[ ABRIR ]</span>
                </div>
            `;
        });
        showView('view-dashboard');
    }

    function promptNewClient() {
        const name = prompt("Nombre del Atleta:");
        if (name) {
            let weeks = {};
            for(let i=1; i<=12; i++) weeks[i] = [];
            db.clients.push({ name, weeks });
            localStorage.setItem('prime_v7_db', JSON.stringify(db));
            renderDashboard();
        }
    }

    function openTracker(clientIdx) {
        cClientIndex = clientIdx;
        cWeek = 1;
        cDayIndex = 0;
        document.getElementById('tracker-client-name').innerText = db.clients[cClientIndex].name;
        renderTabs();
        showView('view-tracker');
    }

    function renderTabs() {
        const wTabs = document.getElementById('week-tabs');
        wTabs.innerHTML = '';
        for(let i=1; i<=12; i++) {
            wTabs.innerHTML += `<div class="tab-pill ${cWeek === i ? 'active' : ''}" onclick="selectWeek(${i})">W${i}</div>`;
        }
        
        const dTabs = document.getElementById('day-tabs');
        dTabs.innerHTML = '';
        const client = db.clients[cClientIndex];
        const days = client.weeks[cWeek] || [];
        
        if (days.length === 0) {
            addDay(); 
        } else {
            days.forEach((d, idx) => {
                dTabs.innerHTML += `<div class="tab-pill ${cDayIndex === idx ? 'active' : ''}" onclick="selectDay(${idx})">${d.name || 'DÍA '+(idx+1)}</div>`;
            });
            dTabs.innerHTML += `<div class="tab-pill" style="border-style:dashed; color:var(--text-muted); border-color:var(--border-light);" onclick="addDay()">+ DÍA</div>`;
            renderDayContent();
        }
    }

    function selectWeek(w) { cWeek = w; cDayIndex = 0; renderTabs(); }
    function selectDay(d) { cDayIndex = d; renderTabs(); }

    function addDay() {
        if(cClientIndex === null) return;
        
        const newDay = {
            name: 'DÍA ' + ((db.clients[cClientIndex].weeks[cWeek].length) + 1),
            blocks: []
        };
        db.clients[cClientIndex].weeks[cWeek].push(newDay);
        cDayIndex = db.clients[cClientIndex].weeks[cWeek].length - 1;
        localStorage.setItem('prime_v7_db', JSON.stringify(db));
        renderTabs();
    }

    function deleteCurrentDay() {
        if(confirm("¿Purgar el día actual?")) {
            db.clients[cClientIndex].weeks[cWeek].splice(cDayIndex, 1);
            cDayIndex = 0;
            localStorage.setItem('prime_v7_db', JSON.stringify(db));
            renderTabs();
        }
    }

    function addBlock(type) {
        const day = db.clients[cClientIndex].weeks[cWeek][cDayIndex];
        let newBlock = {
            id: Date.now(),
            type: type,
            exercises: [ { name: '', rpe: 7, sets: [{kg: '', reps: '', done: false}] } ],
            tracker: {}
        };

        if (type === 'lumbar') {
            newBlock.tracker = { stage: 'Fase 1: Centralización', eva: 0, nature: 'Muscular', direction: 'Centraliza', post24: 0 };
        } else {
            newBlock.tracker = { stage: 'Isométrica / Analgesia', eva: 0, nature: 'Tolerable', post24: 0 };
        }

        day.blocks.push(newBlock);
        autoSave();
        renderDayContent();
    }

    function removeBlock(bIdx) {
        if(confirm("¿Eliminar bloque completo?")) {
            db.clients[cClientIndex].weeks[cWeek][cDayIndex].blocks.splice(bIdx, 1);
            autoSave();
            renderDayContent();
        }
    }

    function addExercise(bIdx) {
        const block = db.clients[cClientIndex].weeks[cWeek][cDayIndex].blocks[bIdx];
        block.exercises.push({ name: '', rpe: 7, sets: [{kg: '', reps: '', done: false}] });
        autoSave(); 
        renderDayContent(); 
    }

    function removeExercise(bIdx, exIdx) {
        db.clients[cClientIndex].weeks[cWeek][cDayIndex].blocks[bIdx].exercises.splice(exIdx, 1);
        autoSave();
        renderDayContent();
    }

    function addSet(bIdx, exIdx) {
        db.clients[cClientIndex].weeks[cWeek][cDayIndex].blocks[bIdx].exercises[exIdx].sets.push({kg: '', reps: '', done: false});
        autoSave();
        renderDayContent();
    }

    function renderDayContent() {
        const day = db.clients[cClientIndex].weeks[cWeek][cDayIndex];
        if(!day) return;

        document.getElementById('day-name-input').value = day.name;

        const bContainer = document.getElementById('blocks-container');
        bContainer.innerHTML = '';

        day.blocks.forEach((block, bIdx) => {
            
            let exHTML = '';
            block.exercises.forEach((ex, exIdx) => {
                let setsHTML = '';
                ex.sets.forEach((s, sIdx) => {
                    setsHTML += `
                        <div class="set-row">
                            <div class="set-num">${sIdx + 1}</div>
                            <input type="number" class="set-input dom-kg" placeholder="--" value="${s.kg}" oninput="autoSave()">
                            <input type="number" class="set-input dom-reps" placeholder="--" value="${s.reps}" oninput="autoSave()">
                            <input type="checkbox" class="set-checkbox dom-done" ${s.done ? 'checked' : ''} onchange="autoSave()">
                        </div>
                    `;
                });

                exHTML += `
                    <div class="ex-card">
                        <div class="ex-header">
                            <div class="ex-title-wrap">
                                <span class="ex-triangle">▲</span>
                                <input type="text" class="ex-name-input dom-name" placeholder="EJERCICIO..." value="${ex.name}" oninput="autoSave()">
                            </div>
                            <div class="rpe-wrap">
                                <span style="font-size:0.7rem; color:var(--text-muted);">@</span>
                                <input type="number" class="rpe-input dom-rpe" value="${ex.rpe}" oninput="autoSave()">
                                <span style="font-size:0.7rem; color:var(--rpe-text);">RPE</span>
                                <span style="cursor:pointer; color:var(--neon-red); margin-left:12px; font-weight:bold; font-family:'Share Tech Mono';" onclick="removeExercise(${bIdx}, ${exIdx})">[X]</span>
                            </div>
                        </div>
                        <div class="sets-table">
                            <div class="sets-header">
                                <div>SET</div><div>KG</div><div>REPS</div><div>LOG</div>
                            </div>
                            <div class="sets-wrapper">${setsHTML}</div>
                            <button class="btn" style="width:100%; border:1px dashed var(--border-light); background:transparent; margin-top:5px;" onclick="addSet(${bIdx}, ${exIdx})">+ SERIE</button>
                        </div>
                    </div>
                `;
            });

            let diagHTML = '';
            const t = block.tracker;
            let post24val = isNaN(parseInt(t.post24)) ? 0 : parseInt(t.post24);
            
            if (block.type === 'lumbar') {
                diagHTML = `
                    <div class="diagnostic-section">
                        <h3>DIAGNÓSTICO LUMBAR</h3>
                        <label>FASE CLÍNICA:</label>
                        <select class="l-stage" onchange="autoSave()">
                            <option value="Fase 1: Centralización" ${t.stage==='Fase 1: Centralización'?'selected':''}>Fase 1: Centralización Mecánica</option>
                            <option value="Fase 2: Core/Estabilidad" ${t.stage==='Fase 2: Core/Estabilidad'?'selected':''}>Fase 2: Estabilización Lumbo-Pélvica</option>
                            <option value="Fase 3: Carga Axial" ${t.stage==='Fase 3: Carga Axial'?'selected':''}>Fase 3: Sobrecarga Axial</option>
                        </select>

                        <label>ESCALA EVA (INTRA-SESIÓN): <span class="eva-val-display" style="color:var(--neon-red);">${t.eva}</span>/10</label>
                        <input type="range" class="l-eva" min="0" max="10" value="${t.eva}" oninput="this.previousElementSibling.querySelector('.eva-val-display').innerText=this.value; autoSave()">

                        <label>SÍNTOMA DOMINANTE:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="l-nature-${bIdx}" value="Muscular" ${t.nature==='Muscular'?'checked':''} onchange="autoSave()"> Tensión muscular local</label>
                            <label><input type="radio" name="l-nature-${bIdx}" value="Radicular" ${t.nature==='Radicular'?'checked':''} onchange="autoSave()"> Irritación radicular / Eléctrico</label>
                        </div>

                        <label>VECTOR MDT:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="l-dir-${bIdx}" value="Centraliza" ${t.direction==='Centraliza'?'checked':''} onchange="autoSave()"> Centraliza (Seguro)</label>
                            <label><input type="radio" name="l-dir-${bIdx}" value="Periferaliza" ${t.direction==='Periferaliza'?'checked':''} onchange="autoSave()"> Periferaliza (Riesgo)</label>
                        </div>

                        <label>DOLOR POST 24H (EVA): <span class="eva24-val-display" style="color:var(--neon-red);">${post24val}</span>/10</label>
                        <input type="range" class="l-24" min="0" max="10" value="${post24val}" oninput="this.previousElementSibling.querySelector('.eva24-val-display').innerText=this.value; autoSave()">

                        <div class="semaforo-result s-box">
                            <div class="light s-light"></div>
                            <div>
                                <div class="status-text s-text">--</div>
                                <div class="status-msg s-msg">--</div>
                            </div>
                        </div>
                    </div>
                `;
            } else {
                diagHTML = `
                    <div class="diagnostic-section" style="border-left-color: var(--yellow);">
                        <h3 style="color: var(--yellow);">DIAGNÓSTICO TENDINOSO</h3>
                        <label>FASE DE CARGA:</label>
                        <select class="t-stage" onchange="autoSave()">
                            <option value="Isométrica / Analgesia" ${t.stage==='Isométrica / Analgesia'?'selected':''}>Fase 1: Isométrica / Analgesia</option>
                            <option value="Isotónica Pesada" ${t.stage==='Isotónica Pesada'?'selected':''}>Fase 2: Isotónica Pesada Lenta</option>
                            <option value="Almacenamiento de Energía" ${t.stage==='Almacenamiento de Energía'?'selected':''}>Fase 3: Almacenamiento de Energía</option>
                        </select>

                        <label>DOLOR INTRA-SESIÓN (EVA): <span class="eva-val-display" style="color:var(--yellow);">${t.eva}</span>/10</label>
                        <input type="range" class="t-eva" min="0" max="10" value="${t.eva}" oninput="this.previousElementSibling.querySelector('.eva-val-display').innerText=this.value; autoSave()">

                        <label>COMPORTAMIENTO DEL DOLOR:</label>
                        <div class="radio-group">
                            <label><input type="radio" name="t-nature-${bIdx}" value="Tolerable" ${t.nature==='Tolerable'?'checked':''} onchange="autoSave()"> Carga tolerada (Molestia sorda)</label>
                            <label><input type="radio" name="t-nature-${bIdx}" value="Agudo" ${t.nature==='Agudo'?'checked':''} onchange="autoSave()"> Dolor agudo / Punzante articular</label>
                        </div>

                        <label>DOLOR POST 24H (EVA): <span class="eva24-val-display" style="color:var(--yellow);">${post24val}</span>/10</label>
                        <input type="range" class="t-24" min="0" max="10" value="${post24val}" oninput="this.previousElementSibling.querySelector('.eva24-val-display').innerText=this.value; autoSave()">

                        <div class="semaforo-result s-box">
                            <div class="light s-light"></div>
                            <div>
                                <div class="status-text s-text">--</div>
                                <div class="status-msg s-msg">--</div>
                            </div>
                        </div>
                    </div>
                `;
            }

            bContainer.innerHTML += `
                <div class="block-card" data-bidx="${bIdx}">
                    <div class="block-header">
                        <div class="block-title">PROTOCOLO: ${block.type === 'lumbar' ? 'LUMBAR' : 'TENDINOSO'}</div>
                        <button class="btn" style="border:none; color:var(--neon-red);" onclick="removeBlock(${bIdx})">[X] ELIMINAR</button>
                    </div>
                    ${exHTML}
                    <button class="btn" style="width:100%; border: 1px dashed var(--border-light); background: rgba(255,255,255,0.02); margin-bottom: 20px;" onclick="addExercise(${bIdx})">+ AÑADIR EJERCICIO</button>
                    ${diagHTML}
                </div>
            `;
        });

        document.querySelectorAll('.block-card').forEach((bCard, bIdx) => {
            const block = day.blocks[bIdx];
            if(block.type === 'lumbar') {
                evaluateLumbar(block.tracker, bCard);
            } else {
                evaluateTendon(block.tracker, bCard);
            }
        });
    }

    function autoSaveDayName() {
        if(cClientIndex === null || !db.clients[cClientIndex].weeks[cWeek][cDayIndex]) return;
        const day = db.clients[cClientIndex].weeks[cWeek][cDayIndex];
        day.name = document.getElementById('day-name-input').value;
        
        clearTimeout(titleSaveTimeout);
        titleSaveTimeout = setTimeout(() => {
            localStorage.setItem('prime_v7_db', JSON.stringify(db));
            triggerSaveIndicator();
            const dTabs = document.getElementById('day-tabs');
            const days = db.clients[cClientIndex].weeks[cWeek];
            dTabs.innerHTML = '';
            days.forEach((d, idx) => {
                dTabs.innerHTML += `<div class="tab-pill ${cDayIndex === idx ? 'active' : ''}" onclick="selectDay(${idx})">${d.name || 'DÍA '+(idx+1)}</div>`;
            });
            dTabs.innerHTML += `<div class="tab-pill" style="border-style:dashed; color:var(--text-muted); border-color:var(--border-light);" onclick="addDay()">+ DÍA</div>`;
        }, 800); 
    }

    function autoSave() {
        if(cClientIndex === null || !db.clients[cClientIndex].weeks[cWeek][cDayIndex]) return;
        const day = db.clients[cClientIndex].weeks[cWeek][cDayIndex];

        document.querySelectorAll('.block-card').forEach((bCard) => {
            const bIdx = bCard.getAttribute('data-bidx');
            const block = day.blocks[bIdx];

            const exCards = bCard.querySelectorAll('.ex-card');
            block.exercises = Array.from(exCards).map(exCard => {
                const setRows = exCard.querySelectorAll('.set-row');
                const sets = Array.from(setRows).map(row => ({
                    kg: row.querySelector('.dom-kg').value,
                    reps: row.querySelector('.dom-reps').value,
                    done: row.querySelector('.dom-done').checked
                }));
                return {
                    name: exCard.querySelector('.dom-name').value,
                    rpe: exCard.querySelector('.dom-rpe').value,
                    sets: sets
                };
            });

            if (block.type === 'lumbar') {
                block.tracker.stage = bCard.querySelector('.l-stage').value;
                block.tracker.eva = parseInt(bCard.querySelector('.l-eva').value);
                block.tracker.nature = bCard.querySelector(`input[name="l-nature-${bIdx}"]:checked`).value;
                block.tracker.direction = bCard.querySelector(`input[name="l-dir-${bIdx}"]:checked`).value;
                block.tracker.post24 = parseInt(bCard.querySelector('.l-24').value);
                evaluateLumbar(block.tracker, bCard);
            } else {
                block.tracker.stage = bCard.querySelector('.t-stage').value;
                block.tracker.eva = parseInt(bCard.querySelector('.t-eva').value);
                block.tracker.nature = bCard.querySelector(`input[name="t-nature-${bIdx}"]:checked`).value;
                block.tracker.post24 = parseInt(bCard.querySelector('.t-24').value);
                evaluateTendon(block.tracker, bCard);
            }
        });

        clearTimeout(saveTimeout);
        saveTimeout = setTimeout(() => {
            localStorage.setItem('prime_v7_db', JSON.stringify(db));
            triggerSaveIndicator();
        }, 500);
    }

    function evaluateLumbar(t, bCard) {
        let color, status, msg;
        let post24val = isNaN(parseInt(t.post24)) ? 0 : parseInt(t.post24);

        if (t.nature === 'Radicular' || t.direction === 'Periferaliza' || t.eva > 5 || post24val > 5) {
            color = 'var(--neon-red)'; status = 'ALERTA CRÍTICA';
            msg = 'Compromiso radicular o empeoramiento post-sesión. Detener patrón. Reducir carga drásticamente.';
        } else if ((t.eva >= 4 && t.eva <= 5) || (post24val >= 4 && post24val <= 5)) {
            color = 'var(--yellow)'; status = 'ADVERTENCIA';
            msg = 'Límite tisular alcanzado. Mantener carga. Prohibida progresión.';
        } else {
            color = 'var(--green)'; status = 'ÓPTIMO';
            msg = 'Adaptación confirmada y recuperación adecuada. Autorizada sobrecarga progresiva.';
        }
        applyLogicUI(bCard, color, status, msg);
    }

    function evaluateTendon(t, bCard) {
        let color, status, msg;
        let post24val = isNaN(parseInt(t.post24)) ? 0 : parseInt(t.post24);

        if (t.nature === 'Agudo' || t.eva > 5 || post24val > 5) {
            color = 'var(--neon-red)'; status = 'SOBRECARGA AGUDA';
            msg = 'Capacidad tendinosa excedida. Retroceder a fase isométrica o reducir volumen/intensidad.';
        } else if ((t.eva >= 4 && t.eva <= 5) || (post24val >= 4 && post24val <= 5)) {
            color = 'var(--yellow)'; status = 'ZONA DE ADAPTACIÓN';
            msg = 'Respuesta esperable. Mantener parámetros actuales hasta consolidar tolerancia al estímulo.';
        } else {
            color = 'var(--green)'; status = 'ÓPTIMO';
            msg = 'Estímulo asimilado correctamente con recuperación basal. Progresar carga mecánica según macrociclo.';
        }
        applyLogicUI(bCard, color, status, msg);
    }

    function applyLogicUI(bCard, color, status, msg) {
        const box = bCard.querySelector('.s-box');
        box.style.borderColor = color;
        const light = bCard.querySelector('.s-light');
        light.style.backgroundColor = color;
        light.style.boxShadow = `0 0 15px ${color}`;
        const txt = bCard.querySelector('.s-text');
        txt.innerText = status; txt.style.color = color;
        bCard.querySelector('.s-msg').innerText = msg;
    }
</script>
</body>
</html>
